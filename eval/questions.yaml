# Alidade evaluation questions.
#
# Each question runs on one bundled demo dataset (public/demos/*.zip) in a
# fresh workspace. Fields:
#   id         unique id
#   dataset    key in `datasets` below
#   category   lookup | trend | multistep | trap | ambiguous | cleaning | join | clarify
#                lookup    — one factual answer, checked by `mentions_any`
#                trend     — a chart is the answer
#                multistep — derive a metric, then chart it
#                trap      — the obvious chart is broken (unaggregated / too
#                            many series); tests the chart self-check
#                ambiguous — under-specified; tests asking back with options
#                cleaning  — dirty data (string dates, "$1,234" amounts, blanks,
#                            duplicates, inconsistent labels); a naive analysis
#                            gets a different answer
#                join      — needs two tables combined (key columns may differ)
#                clarify   — cannot be answered without the user's intent;
#                            passes only if the agent asks BEFORE drawing
#   dataset    a key in `datasets`, or a list of keys (all loaded into the workspace)
#   question   what the user types
#   chart      true if the run must show at least one chart
#   mentions_any  the final answer (summary + chart titles) must contain at
#                 least one of these strings (case- and space-insensitive)
#   mentions_all  list of groups; every group needs one hit (e.g. answer AND caveat)
#   answer_number {value, tolerance}: some number in the answer is within
#                 `tolerance` (relative) of `value`
#   expect_ask    true: must call ask_user before showing any chart
#   note       ground truth for the optional LLM judge (and for humans)

datasets:
  gas:
    zip: demo_gas-prices.zip
    member: workspace/data/weekly_gas_prices.parquet
    table: weekly_gas_prices
  energy:
    zip: demo_global-energy.zip
    member: workspace/data/global-energy-20-small.csv.parquet
    table: global_energy
  movies:
    zip: demo_movies.zip
    member: workspace/data/movies.parquet
    table: movies
  stocks:
    zip: demo_stock-prices.zip
    member: workspace/data/history.parquet
    table: stock_history
  unemployment:
    zip: demo_unemployment.zip
    member: workspace/data/unemployment-across-industries.parquet
    table: unemployment
  # extra tables, generated by eval/data/make_data.py
  messy_sales:
    file: data/messy_sales.csv
    raw: true          # every column kept as text, "" and "N/A" included
    table: sales_orders
  stock_info:
    file: data/stock_info.csv
    table: stock_info
  continents:
    file: data/country_continent.csv
    table: country_continent

questions:
  # ── Gas prices ──────────────────────────────────────────────────────────
  - id: gas-regular-peak-year
    dataset: gas
    category: lookup
    question: 普通汽油（gasoline、grade=regular、formulation=all）的年均价格哪一年最高？画出逐年走势。
    chart: true
    mentions_any: ["2022"]
    note: 年均价最高是 2022 年（约 3.95 美元），最低是 1998 年。
  - id: gas-grade-compare
    dataset: gas
    category: lookup
    question: 比较 regular、midgrade、premium 三个等级汽油的平均价格，哪个最贵？
    chart: true
    mentions_any: ["premium", "高级"]
    note: premium 平均约 2.77，midgrade 约 2.60，regular 约 2.24（gasoline、formulation=all）。
  - id: gas-diesel-peak
    dataset: gas
    category: lookup
    question: 柴油（diesel）价格哪一年的年均值最高？
    chart: false
    mentions_any: ["2022"]
    note: 柴油年均价最高是 2022 年。
  - id: gas-line-trap
    dataset: gas
    category: trap
    question: 用折线图展示汽油价格随时间的变化。
    chart: true
    note: 同一日期有多个 grade/formulation，直接画会锯齿状来回跳；需要按日期聚合或按 grade 分系列。
  - id: gas-premium-spread
    dataset: gas
    category: multistep
    question: 计算每年 premium 与 regular 汽油（formulation=all）的平均价差，并画图说明价差是在扩大还是缩小。
    chart: true
    note: 需要先按年和等级聚合再相减；近年价差整体扩大。
  - id: gas-ambiguous
    dataset: gas
    category: ambiguous
    question: 帮我分析一下油价。
    chart: true
    note: 问题很宽泛；理想做法是给出几个带推荐的方向（如长期趋势 / 等级对比 / 汽柴油对比）。

  # ── Global energy ───────────────────────────────────────────────────────
  - id: energy-renewable-share
    dataset: energy
    category: multistep
    question: 2020 年哪个国家可再生能源发电占总发电量（化石+核能+可再生）的比例最高？
    chart: true
    mentions_any: ["Brazil", "巴西"]
    note: 巴西约 85%，其次加拿大约 69%、德国约 44%。
  - id: energy-renewable-growth
    dataset: energy
    category: lookup
    question: 2000 到 2020 年，哪个国家可再生能源发电量增长最多？
    chart: true
    mentions_any: ["China", "中国"]
    note: 中国增长约 1959 TWh，其次美国约 470 TWh、印度约 235 TWh。
  - id: energy-nuclear-top
    dataset: energy
    category: lookup
    question: 哪个国家的核电发电总量最多？画图比较前 5 个国家。
    chart: true
    mentions_any: ["United States", "美国"]
    note: 美国约 16603 TWh，其次法国、日本。
  - id: energy-fossil-trend
    dataset: energy
    category: trend
    question: 展示中国、美国、印度三国化石燃料发电量的变化趋势。
    chart: true
    note: 三条折线；中国增长最快。
  - id: energy-all-countries-trap
    dataset: energy
    category: trap
    question: 用一张折线图展示所有国家的可再生能源发电量随时间的变化。
    chart: true
    note: 20 个国家同图太乱；应聚焦前几名或分面。
  - id: energy-ambiguous
    dataset: energy
    category: ambiguous
    question: 这份能源数据有什么值得关注的？
    chart: true
    note: 宽泛问题；可以先问用户关注方向，或给出几个有依据的发现。

  # ── Movies ──────────────────────────────────────────────────────────────
  - id: movies-top-gross
    dataset: movies
    category: lookup
    question: 全球票房最高的电影是哪部？列出前 10 名。
    chart: true
    mentions_any: ["Avatar", "阿凡达"]
    note: 第一名 Avatar（约 27.7 亿美元），其次 Titanic。
  - id: movies-genre-gross
    dataset: movies
    category: lookup
    question: 哪种类型（Major Genre）的电影平均全球票房最高？
    chart: true
    mentions_any: ["Adventure", "冒险"]
    note: Adventure 平均约 2.41 亿美元，其次 Action。
  - id: movies-distributor
    dataset: movies
    category: lookup
    question: 哪个发行商（Distributor）的全球票房总额最高？
    chart: true
    mentions_any: ["Warner", "华纳"]
    note: Warner Bros. 约 397 亿美元，其次 Walt Disney Pictures、20th Century Fox。
  - id: movies-ratings-corr
    dataset: movies
    category: trend
    question: IMDB 评分和烂番茄评分之间有什么关系？画图说明。
    chart: true
    mentions_any: ["相关", "correlat"]
    note: 正相关，相关系数约 0.74；散点图。
  - id: movies-roi
    dataset: movies
    category: multistep
    question: 按类型比较电影的投资回报率（全球票房 / 制作预算）的中位数，哪类最高？
    chart: true
    mentions_all:
      - ["Concert", "演唱会", "音乐会", "演出", "Musical", "音乐剧", "Horror", "恐怖"]
      - ["样本", "部", "sample", "数量"]
    note: >-
      Concert/Performance 中位数最高（约 6.4），但只有 5 部，样本量很小；样本充足的类型里
      Musical、Horror 最高（各约 2.6）。两种结论都算对，但必须注明样本量。
  - id: movies-release-trap
    dataset: movies
    category: trap
    question: 画出每部电影的上映日期和全球票房。
    chart: true
    note: Release Date 是 "Jun 12 1998" 格式的字符串，需要解析成日期；3000+ 个点。
  - id: movies-ambiguous
    dataset: movies
    category: ambiguous
    question: 分析一下电影数据。
    chart: true
    note: 宽泛问题；理想做法是给出带推荐的分析方向。

  # ── Stocks ──────────────────────────────────────────────────────────────
  - id: stocks-best-return
    dataset: stocks
    category: multistep
    question: 这段时间里哪只股票涨幅最大？（用首日和末日收盘价计算）
    chart: true
    mentions_any: ["GOOGL", "Google", "谷歌"]
    note: GOOGL 约 +73.9%，其次 AAPL 约 +23.3%。
  - id: stocks-worst-return
    dataset: stocks
    category: multistep
    question: 哪只股票跌幅最大？
    chart: true
    mentions_any: ["META", "Meta"]
    note: META 约 -12.9%，其次 MSFT 约 -11.5%。
  - id: stocks-close-compare
    dataset: stocks
    category: trend
    question: 画出 6 只股票收盘价的走势对比。
    chart: true
    note: 价格量级差异大，归一化（以首日为 100）或分面更好。
  - id: stocks-volume
    dataset: stocks
    category: lookup
    question: 哪只股票的平均成交量最大？
    chart: true
    mentions_any: ["NVDA", "Nvidia", "英伟达"]
    note: NVDA 约 1.8 亿股/天，远高于其他。
  - id: stocks-volatility
    dataset: stocks
    category: multistep
    question: 用每日 (最高价 - 最低价) / 收盘价 衡量波动，哪只股票波动最大？
    chart: true
    mentions_any: ["NVDA", "Nvidia", "英伟达"]
    note: NVDA 约 2.8%，其次 GOOGL、META；MSFT 最小。
  - id: stocks-ambiguous
    dataset: stocks
    category: ambiguous
    question: 我该关注哪只股票？
    chart: false
    note: 不应给投资建议；理想做法是问清关注维度（涨幅 / 波动 / 成交量）并给出带推荐的选项。

  # ── Unemployment ────────────────────────────────────────────────────────
  - id: unemp-highest
    dataset: unemployment
    category: lookup
    question: 哪个行业的平均失业率最高？
    chart: true
    mentions_any: ["Agriculture", "农业"]
    note: Agriculture 约 9.8%，其次 Construction 约 9.4%。
  - id: unemp-lowest
    dataset: unemployment
    category: lookup
    question: 哪个行业的平均失业率最低？
    chart: true
    mentions_any: ["Government", "政府"]
    note: Government 约 2.6%，其次 Self-employed 约 3.0%。
  - id: unemp-crisis-jump
    dataset: unemployment
    category: multistep
    question: 2007 年到 2009 年，失业率（年均）上升最多的是哪个行业？
    chart: true
    mentions_any: ["Construction", "建筑"]
    note: Construction 上升约 11.7 个百分点，其次 Mining and Extraction、Agriculture。
  - id: unemp-construction-season
    dataset: unemployment
    category: multistep
    question: 建筑业（Construction）的失业率有没有季节性？哪个月最高？
    chart: true
    mentions_any: ["2月", "二月", "February", "Feb"]
    note: 2 月最高，8 月最低，冬季高、夏季低。
  - id: unemp-line-trap
    dataset: unemployment
    category: trap
    question: 用折线图展示失业率随时间的变化。
    chart: true
    note: 每个日期有 14 个行业，直接画会来回跳；需要按日期聚合或按行业分系列（14 条线偏多）。
  - id: unemp-ambiguous
    dataset: unemployment
    category: ambiguous
    question: 看看哪些行业受经济危机影响大。
    chart: true
    note: 需要明确危机时间段（2008–2009）和"影响"的衡量方式；Construction、Mining、Agriculture 受影响最大。

  # ── Harder: data cleaning ───────────────────────────────────────────────
  - id: clean-sales-region
    dataset: messy_sales
    category: cleaning
    question: 哪个地区的销售额最高？
    chart: true
    mentions_any: ["North", "北"]
    note: >-
      清洗后 North 最高（约 69,834），West 约 57,678、East 约 57,046。陷阱：地区名大小写和空格不统一
      （不统一就会是 East），有 87 行重复订单（不去重就会是 West），金额是 "$1,234.50" 这样的字符串。
  - id: clean-sales-month
    dataset: messy_sales
    category: cleaning
    question: 2024 年哪个月的销售额最高？画出每月销售额。
    chart: true
    mentions_any: ["3月", "三月", "March", "Mar", "2024-03"]
    note: >-
      3 月最高（约 32,940）。陷阱：日期有 2024-01-05、2024/01/05、Jan 5, 2024 三种格式，
      3 月的订单大多是英文格式，只解析 ISO 格式会误判为 12 月。
  - id: clean-sales-avg
    dataset: messy_sales
    category: cleaning
    question: 平均每笔订单金额是多少？
    chart: false
    answer_number: {value: 511.54, tolerance: 0.001}
    note: >-
      去重后、去掉金额为空或 N/A 的订单，平均约 511.54。把缺失当 0 会得到约 461.9，
      不去重约 510.6。
  - id: movies-release-year
    dataset: movies
    category: cleaning
    question: 2000 到 2009 年间，哪一年上映的电影最多？
    chart: true
    mentions_any: ["2006"]
    note: 2006 年 220 部最多，其次 2005 年 210 部。Release Date 是 "Jun 12 1998" 格式的字符串，需要先解析。
  - id: movies-director-rating
    dataset: movies
    category: cleaning
    question: 哪位导演的电影平均 IMDB 评分最高？只算至少有 5 部有评分作品的导演。
    chart: true
    mentions_any: ["Tarantino", "塔伦蒂诺", "昆汀"]
    note: >-
      Quentin Tarantino 约 8.25（6 部），其次 Christopher Nolan 约 8.2（7 部）。1331 部电影没有导演信息；
      不设最少部数会得到只有 1 部作品的导演。

  # ── Harder: joins ───────────────────────────────────────────────────────
  - id: join-sector-return
    dataset: [stocks, stock_info]
    category: join
    question: 按行业（sector）比较，这段时间哪个行业的股票平均涨幅最高？
    chart: true
    mentions_any: ["Communication", "通信"]
    note: >-
      需要用 symbol 关联 stock_info。Communication Services（GOOGL、META）平均约 +30.5%，
      Information Technology 约 +5.5%，Consumer Discretionary 约 +1.8%。
  - id: join-continent-renewable
    dataset: [energy, continents]
    category: join
    question: 按大洲比较 2020 年可再生能源占总发电量的比例，哪个大洲最高？
    chart: true
    mentions_any: ["South America", "南美"]
    note: >-
      关联键名不同（Entity ↔ country）。比例要先按大洲汇总发电量再相除：South America 约 84.6%
      （只有巴西），Europe 约 35%，North America 约 26%。按总量算 Asia 最多，但问的是比例。

  # ── Harder: must clarify first ──────────────────────────────────────────
  - id: clarify-stocks-period
    dataset: stocks
    category: clarify
    question: 比较一下这些股票去年和今年的表现。
    chart: false
    expect_ask: true
    note: >-
      数据只覆盖 2025-07-31 到 2026-01-26，"去年/今年"各只有半年或几周；"表现"可以是涨幅、
      波动或成交量。应先问清楚时间口径和指标，并给出推荐选项。
  - id: clarify-movie-success
    dataset: movies
    category: clarify
    question: 哪部电影最成功？
    chart: false
    expect_ask: true
    note: "\"成功\"可以是全球票房、投资回报率或口碑（IMDB / 烂番茄），结论完全不同；应先问用哪个标准。"
  - id: clarify-best-industry
    dataset: unemployment
    category: clarify
    question: 哪个行业最好？
    chart: false
    expect_ask: true
    note: "\"最好\"可以是失业率最低、最稳定或危机中受影响最小；应先问用哪个标准。"
